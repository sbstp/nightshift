[package]
name = "nightshift"
version = "0.3.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
bytes = "1.10.1"
clap = { version = "4.5.15", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["into", "from"] }
fuser = { version = "0.14.0", default-features = false, features = [
    "abi-7-10",
] }
libc = "0.2.155"
log = "0.4.22"
lz4_flex = "0.11.3"
parking_lot = "0.12.5"
r2d2 = "0.8.10"
r2d2_sqlite = "0.33.0"
rusqlite = { version = "0.39.0", features = [
    # "bundled",
    "bundled-sqlcipher-vendored-openssl",
    "fallible_uint",
] }
scopeguard = "1.2.0"
signal-hook = "0.3.17"
simple_logger = "5.0.0"
slab = "0.4.9"
zstd = "0.13.2"

[dev-dependencies]
rand = "0.8.5"
sha1 = "0.10.6"
test-log = "0.2.16"

[profile.release]
codegen-units = 1
strip = true
lto = "thin"
# debug = true      # For `cargo flamegraph`
